<html lang="en">
<head>

<style>
/* Layout: one narrow column on graph paper. Progress is drawn as area under a normal curve. */
:root{
  --paper:#EDF1F5; --grid:rgba(19,35,58,.06); --ink:#13233A; --muted:#56677D;
  --card:#FFFFFF; --line:#CBD4DF; --accent:#D9481F; --accent-ink:#FFFFFF;
  --good:#16805F; --good-bg:#E2F3EC; --bad:#B8304A; --bad-bg:#F8E4E8; --gold:#B88A12;
  --fill:rgba(217,72,31,.18);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1625; --grid:rgba(230,237,245,.05); --ink:#E6EDF5; --muted:#93A3B8;
  --card:#15223A; --line:#2A3B57; --accent:#FF7347; --accent-ink:#1A0B05;
  --good:#3CC79F; --good-bg:#12362C; --bad:#FF6F86; --bad-bg:#3A1621; --gold:#E8C468;
  --fill:rgba(255,115,71,.22); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0D1625; --grid:rgba(230,237,245,.05); --ink:#E6EDF5; --muted:#93A3B8;
  --card:#15223A; --line:#2A3B57; --accent:#FF7347; --accent-ink:#1A0B05;
  --good:#3CC79F; --good-bg:#12362C; --bad:#FF6F86; --bad-bg:#3A1621; --gold:#E8C468;
  --fill:rgba(255,115,71,.22); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.1rem;font-weight:800;line-height:1.05}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rank{text-align:right;min-width:0}
.rank b{font-family:var(--f-display);font-size:1.05rem;display:block}
.xpbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;width:150px;margin-left:auto}
.xpbar i{display:block;height:100%;background:var(--accent)}

.curve{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 14px 8px}
.curve svg{display:block;width:100%;height:auto}
.curve .cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:800;font-size:1.6rem}

/* map */
.path{display:flex;flex-direction:column;gap:0;position:relative}
.node{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:stretch}
.rail{display:flex;flex-direction:column;align-items:center}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.9rem;border:2px solid var(--line);background:var(--card);flex:none}
.node.done .dot{background:var(--good);border-color:var(--good);color:var(--card)}
.node.open .dot{border-color:var(--accent);color:var(--accent)}
.stem{width:2px;flex:1;background:var(--line);min-height:14px}
.node:last-child .stem{display:none}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.node.locked .ucard{opacity:.55}
.ucard p{margin:0;font-size:.92rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stars{font-size:.95rem;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:4px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.boss .ucard{border:2px solid var(--accent)}

/* quiz */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lives{display:flex;gap:4px}
.lives i{width:16px;height:16px;border-radius:50%;background:var(--bad);display:block}
.lives i.lost{background:var(--line)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--line);display:block}
.pips i.ok{background:var(--good)} .pips i.no{background:var(--bad)} .pips i.cur{background:var(--accent)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtext{font-size:1.08rem;font-weight:500;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:5px;padding:11px 12px;font-size:.98rem}
.opt span:first-child{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-left:4px solid var(--good);background:var(--good-bg);padding:12px 14px;border-radius:0 5px 5px 0;font-size:.95rem}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.fb b{font-family:var(--f-display)}
.streak{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:600}

/* guide */
.guide{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.guide ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.guide li{max-width:62ch}
.formula{font-family:var(--f-mono);background:var(--paper);border:1px dashed var(--line);border-radius:4px;padding:2px 6px;font-size:.88em;white-space:nowrap}

.result{text-align:center;align-items:center}
.result .score{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1}
.toast{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.linkish{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}
@media (prefers-reduced-motion: no-preference){
  .qcard{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const r2=x=>Math.round(x*100)/100, r1=x=>Math.round(x*10)/10;
function mk(q,correct,distract,e){
  const c=String(correct);const set=new Set([c]);const out=[];
  for(const d of distract){const s=String(d);if(!set.has(s)){set.add(s);out.push(s)}if(out.length===3)break}
  let k=1;while(out.length<3){const n=parseFloat(correct);const s=isNaN(n)?c+"?":String(r2(n+k*(k%2?1.5:-1.5)));if(!set.has(s)){set.add(s);out.push(s)}k++}
  return [q,[c,...out],e];
}

/* ---------- course content: [question, [correct, ...wrong], explanation] ---------- */
const UNITS=[
{t:"Research Design",tag:"Unit 1",sub:"Variables, study types, sampling, validity",
guide:[
 "<b>Independent variable (IV)</b> is what you manipulate or group by. <b>Dependent variable (DV)</b> is the outcome you measure.",
 "<b>Experiment</b> = random assignment to conditions. Only design that supports cause-and-effect claims.",
 "<b>Observational</b>: cohort (follow exposure forward), case-control (start with outcome, look back), cross-sectional (one snapshot).",
 "<b>Random sampling</b> protects external validity (generalize). <b>Random assignment</b> protects internal validity (causation).",
 "<b>Levels of measurement</b>: nominal (labels) → ordinal (ranked) → interval (equal gaps, no true zero) → ratio (true zero).",
 "<b>Reliability</b> = consistency. <b>Validity</b> = measuring what you claim to measure. A tool can be reliable but invalid."],
qs:[
 ["A study tests whether dry needling reduces neck pain. Pain score on a 0–10 scale is the…",["Dependent variable","Independent variable","Confounding variable","Control variable"],"The outcome you measure is the DV. Dry needling vs. no needling is the IV."],
 ["What feature makes a study a true experiment?",["Random assignment to conditions","A large sample size","A control group of any kind","Measurements taken over time"],"Random assignment balances confounders across groups, which is what allows causal conclusions."],
 ["Researchers follow 2,000 runners forward for 5 years and record who develops a stress fracture. Design?",["Prospective cohort study","Case-control study","Cross-sectional study","Randomized controlled trial"],"Exposure measured first, followed forward to the outcome, no assignment = prospective cohort."],
 ["Researchers compare 80 patients with ACL tears to 80 without and look back at their prior sports history. Design?",["Case-control study","Prospective cohort study","Randomized controlled trial","Cross-sectional study"],"Starting from the outcome (cases vs. controls) and looking backward at exposures defines case-control."],
 ["Random SAMPLING mainly protects which kind of validity?",["External validity (generalizability)","Internal validity (causation)","Construct validity","Face validity"],"Sampling decides who is in the study, so it controls how well results generalize. Assignment controls causation."],
 ["Range of motion measured in degrees is what level of measurement?",["Ratio","Interval","Ordinal","Nominal"],"0° means no motion (a true zero), and 60° is twice 30°. That's ratio."],
 ["Blood type (A, B, AB, O) is measured at which level?",["Nominal","Ordinal","Interval","Ratio"],"Categories with no order are nominal."],
 ["A goniometer gives the same reading every time but is always 10° off. It is…",["Reliable but not valid","Valid but not reliable","Both reliable and valid","Neither reliable nor valid"],"Consistent = reliable. Consistently wrong = not valid."],
 ["Older patients both exercise less and heal slower, muddying an exercise-vs-healing study. Age is a…",["Confounding variable","Dependent variable","Moderator you manipulated","Placebo"],"A confounder is related to both the IV and DV and offers an alternative explanation."],
 ["In a double-blind trial, who doesn't know group assignment?",["Participants and the researchers assessing them","Only the participants","Only the statistician","Only the treating clinician"],"Double-blind hides assignment from both participants and the people measuring outcomes, reducing bias on both sides."],
 ["Splitting a clinic's patients into age bands, then randomly sampling within each band, is…",["Stratified random sampling","Cluster sampling","Convenience sampling","Systematic sampling"],"Strata are subgroups; sampling randomly within each one guarantees every subgroup is represented."]
],gen:[]},

{t:"Describing Data",tag:"Unit 2",sub:"Center, spread, shape",
guide:[
 "<b>Mean</b> <span class='formula'>Σx / n</span> is pulled by outliers. <b>Median</b> is the middle value and resists outliers.",
 "Skewed data (income, length of stay) → report the <b>median</b>.",
 "<b>Right skew</b> (long tail right): mean > median. <b>Left skew</b>: mean < median.",
 "<b>Variance</b> <span class='formula'>s² = Σ(x−x̄)² / (n−1)</span>. <b>SD</b> = √variance, in the original units.",
 "<b>IQR</b> = Q3 − Q1, the spread of the middle 50%. Outlier rule: beyond 1.5 × IQR from the quartiles."],
qs:[
 ["Hospital length-of-stay data has a few very long stays. Best measure of center?",["Median","Mean","Mode","Range"],"Long stays drag the mean upward. The median is robust to extreme values."],
 ["In a right-skewed distribution, typically…",["Mean > median","Mean < median","Mean = median","Mode > mean"],"The long right tail pulls the mean toward it, past the median."],
 ["Standard deviation describes…",["Typical distance of scores from the mean","The most common score","The middle score","The difference between max and min"],"SD is the average-ish spread around the mean, in the original units."],
 ["If the SD is 4, the variance is…",["16","2","4","8"],"Variance = SD². 4² = 16."],
 ["Which statistic is most affected by a single extreme outlier?",["Mean","Median","IQR","Mode"],"Every value feeds the mean, so one extreme value shifts it. Median and IQR barely move."],
 ["Q1 = 22 and Q3 = 40. The IQR is…",["18","62","31","9"],"IQR = Q3 − Q1 = 40 − 22 = 18."],
 ["Why divide by n − 1 for a sample variance?",["It corrects the underestimate of population spread","It makes the math easier","It removes outliers","It converts to standard units"],"Sample data hug their own mean, so dividing by n underestimates spread. n − 1 (Bessel's correction) fixes it."],
 ["Two classes both average 75. Class A has SD = 3, Class B has SD = 12. Which is true?",["Class B scores are more spread out","Class A had more students","Class B has a higher median","Class A is skewed"],"Same center, different spread. Larger SD = scores scattered farther from the mean."]
],gen:["mean","median"]},

{t:"Normal Curve & z-Scores",tag:"Unit 3",sub:"Standardizing and the 68-95-99.7 rule",
guide:[
 "<b>z-score</b> <span class='formula'>z = (x − μ) / σ</span>: how many SDs a value sits from the mean.",
 "Standard normal: mean 0, SD 1. z = 0 is the 50th percentile.",
 "<b>Empirical rule</b>: ~68% within ±1 SD, ~95% within ±2 SD, ~99.7% within ±3 SD.",
 "Above z = +1 ≈ 16%. Above z = +2 ≈ 2.5%. Above z = +1.96 is exactly 2.5% (the 95% cutoff).",
 "Negative z = below the mean. Sign tells direction, size tells distance."],
qs:[
 ["About what percent of a normal distribution falls within ±1 SD of the mean?",["68%","95%","50%","99.7%"],"Empirical rule: 68 / 95 / 99.7 for 1 / 2 / 3 SDs."],
 ["About what percent falls ABOVE z = +2?",["2.5%","5%","16%","34%"],"95% is within ±2, so 5% is outside, split into 2.5% per tail."],
 ["A z-score of −1.5 means the value is…",["1.5 SD below the mean","1.5 points below the mean","At the 15th percentile exactly","1.5 SD above the mean"],"z is measured in SD units; the minus sign means below."],
 ["A z-score of 0 corresponds to which percentile?",["50th","0th","68th","100th"],"z = 0 is exactly the mean, and in a symmetric normal curve the mean is the median."],
 ["The standard normal distribution has…",["Mean 0, SD 1","Mean 1, SD 0","Mean 50, SD 10","Mean 100, SD 15"],"Converting any normal variable to z-scores gives mean 0, SD 1."],
 ["About what percent falls ABOVE z = +1?",["16%","34%","32%","2.5%"],"68% is within ±1, leaving 32% in the tails, 16% per side."],
 ["Which z-score is the most unusual result?",["z = −2.8","z = 1.9","z = −1.2","z = 2.1"],"Distance from 0 is what matters. |−2.8| is the largest."],
 ["Patient A has z = 1.2 on a balance test; Patient B has z = 0.4 on the same test. Which is true?",["A scored further above average than B","B scored higher than A","Both are below average","They can't be compared"],"z-scores on the same scale compare directly. 1.2 SD above beats 0.4 SD above."]
],gen:["z","z","pct"]},

{t:"Sampling & the CLT",tag:"Unit 4",sub:"Standard error and sampling distributions",
guide:[
 "<b>Parameter</b> describes a population (μ, σ). <b>Statistic</b> describes a sample (x̄, s).",
 "<b>Sampling distribution</b>: the distribution of a statistic (like x̄) across many repeated samples.",
 "<b>Standard error</b> <span class='formula'>SE = σ / √n</span>: the SD of the sampling distribution.",
 "Bigger n → smaller SE. Quadruple n to cut SE in half.",
 "<b>Central Limit Theorem</b>: with n ≈ 30+, the sampling distribution of x̄ is roughly normal even if the population isn't."],
qs:[
 ["The mean resting heart rate of ALL adults in Mississippi is a…",["Parameter","Statistic","Sample","Variable estimate"],"Describes the full population = parameter. A sample's mean would be a statistic."],
 ["As sample size increases, the standard error…",["Decreases","Increases","Stays the same","Becomes the variance"],"SE = σ/√n. Larger n in the denominator shrinks it."],
 ["To cut the standard error in half, you need to…",["Quadruple the sample size","Double the sample size","Halve the sample size","Double the SD"],"Because of the square root, √4 = 2. Four times the n gives half the SE."],
 ["The Central Limit Theorem says the sampling distribution of the mean…",["Is approximately normal for large n, regardless of population shape","Matches the population's shape exactly","Is always skewed","Has the same SD as the population"],"That's why we can use normal-based tests on means even with skewed raw data."],
 ["Standard error is the standard deviation of…",["The sampling distribution of a statistic","The raw scores in your sample","The population","The residuals"],"SD describes individuals. SE describes how much sample means bounce around."],
 ["The difference between a sample mean and the true population mean due to chance is called…",["Sampling error","Bias","Measurement error","Type I error"],"Random sample-to-sample variation is sampling error. Bias is systematic, not random."]
],gen:["se","se"]},

{t:"Hypothesis Testing",tag:"Unit 5",sub:"Nulls, p-values, errors, power",
guide:[
 "<b>H₀</b> (null): no effect / no difference. <b>H₁</b>: there is an effect.",
 "<b>p-value</b>: probability of results at least this extreme <i>if H₀ were true</i>. Not the probability H₀ is true.",
 "If p ≤ α (usually .05) → reject H₀. Otherwise → <b>fail to reject</b> (never \"accept\").",
 "<b>Type I error (α)</b>: false positive, rejecting a true H₀. <b>Type II error (β)</b>: false negative, missing a real effect.",
 "<b>Power</b> = 1 − β. Increase it with larger n, larger effect, larger α, less noise.",
 "Statistically significant ≠ clinically meaningful. Compare effects to the <b>MCID</b>."],
qs:[
 ["The null hypothesis usually states that…",["There is no effect or difference","The treatment works","The sample is biased","The p-value is small"],"H₀ is the 'nothing is going on' baseline you try to find evidence against."],
 ["p = .03 with α = .05. Decision?",["Reject the null","Fail to reject the null","Accept the null","Accept the alternative as proven"],"p ≤ α → reject H₀. You still haven't 'proven' H₁."],
 ["p = .21 with α = .05. Correct wording?",["Fail to reject the null","Accept the null","Reject the null","The null is proven true"],"Not finding evidence isn't proof of no effect. 'Fail to reject' keeps that honest."],
 ["A p-value of .04 means…",["If H₀ were true, results this extreme would occur about 4% of the time","There is a 4% chance H₀ is true","There is a 96% chance the treatment works","4% of patients improved"],"The p-value assumes H₀ is true and asks how surprising your data are."],
 ["Concluding a treatment works when it actually doesn't is a…",["Type I error","Type II error","Sampling error","Power failure"],"False positive = Type I. Its probability is α."],
 ["A small study misses a treatment effect that really exists. That's a…",["Type II error","Type I error","Confound","Ceiling effect"],"False negative = Type II (β). Underpowered studies are prone to it."],
 ["Which change INCREASES statistical power?",["Larger sample size","Smaller α (e.g., .01)","More measurement noise","Smaller effect size"],"More data shrinks SE, making real effects easier to detect."],
 ["A study finds a statistically significant 0.4-point pain reduction, but the MCID is 2 points. Conclusion?",["Significant but not clinically meaningful","Clinically meaningful but not significant","Both significant and meaningful","The study is invalid"],"Large samples make tiny effects significant. Patients won't feel a change below the MCID."],
 ["Power is defined as…",["1 − β","1 − α","α + β","β / α"],"Power is the probability of correctly rejecting a false H₀, which is 1 − Type II error rate."]
],gen:[]},

{t:"t-Tests",tag:"Unit 6",sub:"One-sample, independent, paired",
guide:[
 "<b>One-sample t</b>: sample mean vs. a known value.",
 "<b>Independent t</b>: two separate groups. <span class='formula'>df = n₁ + n₂ − 2</span>",
 "<b>Paired t</b>: same people measured twice (pre/post) or matched pairs. <span class='formula'>df = n − 1</span>",
 "Use t instead of z when σ is unknown (almost always).",
 "Assumptions: roughly normal DV, independent observations, equal variances for independent t (check with <b>Levene's test</b>).",
 "Bigger |t| → smaller p."],
qs:[
 ["Same 20 patients measured before and after a 6-week program. Which test?",["Paired t-test","Independent t-test","One-sample t-test","Chi-square"],"Two measurements on the same people are linked, so you analyze the differences = paired."],
 ["Comparing balance scores between 30 dancers and 30 non-dancers. Which test?",["Independent-samples t-test","Paired t-test","One-sample t-test","Correlation"],"Two separate, unrelated groups = independent t."],
 ["Is your clinic's average treatment time different from the national standard of 45 min?",["One-sample t-test","Paired t-test","Independent t-test","ANOVA"],"One sample compared to a known fixed value."],
 ["Why use a t-test instead of a z-test?",["The population SD is unknown","The sample is too large","The data are categorical","There are three groups"],"The t distribution accounts for extra uncertainty from estimating σ with s."],
 ["Levene's test checks which assumption?",["Equal variances between groups","Normality","Independence","Linearity"],"Homogeneity of variance. If violated, use Welch's t-test."],
 ["As df increases, the t distribution…",["Approaches the normal distribution","Becomes more skewed","Gets fatter tails","Shifts to the right"],"With more data, s estimates σ well and t converges to z."],
 ["Holding everything else constant, a larger absolute t-value leads to…",["A smaller p-value","A larger p-value","No change in p","A larger standard error"],"t measures signal relative to noise. Bigger signal → less likely under H₀."]
],gen:["df","df"]},

{t:"ANOVA, Chi-Square & Nonparametrics",tag:"Unit 7",sub:"3+ groups, categories, rank-based tests",
guide:[
 "<b>One-way ANOVA</b>: compare means of 3+ independent groups. <span class='formula'>F = between-group variance / within-group variance</span>",
 "Running many t-tests instead inflates the <b>Type I error rate</b>.",
 "Significant F only says 'some difference exists' → run <b>post hoc</b> tests (Tukey) to find where.",
 "<b>Repeated-measures ANOVA</b>: same people at 3+ time points.",
 "<b>Chi-square</b>: categorical variables (counts). Expected counts should be ≥ 5 per cell.",
 "Nonparametric swaps: Mann-Whitney U (independent t), Wilcoxon signed-rank (paired t), Kruskal-Wallis (one-way ANOVA), Spearman (Pearson)."],
qs:[
 ["Comparing pain across manual therapy, exercise, and placebo groups. Which test?",["One-way ANOVA","Independent t-test","Paired t-test","Chi-square"],"Three independent groups with a continuous DV = one-way ANOVA."],
 ["Why not just run three separate t-tests?",["It inflates the Type I error rate","t-tests can't handle three groups' data","It reduces sample size","It violates normality"],"Each test carries a 5% false-positive risk; stacking them raises the overall risk to ~14%."],
 ["The ANOVA F-test is significant. Next step?",["Run post hoc tests to find which groups differ","Conclude all groups differ","Run a chi-square","Report that the null is true"],"F tells you at least one mean differs. Post hoc tests (e.g., Tukey) pinpoint which."],
 ["Is injury (yes/no) related to sport (soccer, basketball, track)? Which test?",["Chi-square test of independence","One-way ANOVA","Pearson correlation","Paired t-test"],"Both variables are categorical counts = chi-square."],
 ["The F ratio compares…",["Variance between groups to variance within groups","Two means directly","Observed to expected counts","Pre to post scores"],"A large F means groups differ more than random within-group noise would predict."],
 ["Strength measured in the same athletes at weeks 0, 4, and 8. Which test?",["Repeated-measures ANOVA","One-way ANOVA","Independent t-test","Chi-square"],"Same people, 3+ time points = repeated-measures ANOVA."],
 ["Nonparametric alternative to the independent-samples t-test?",["Mann-Whitney U","Wilcoxon signed-rank","Kruskal-Wallis","Spearman's rho"],"Mann-Whitney compares two independent groups by ranks. Wilcoxon signed-rank is the paired version."],
 ["Nonparametric alternative to a one-way ANOVA?",["Kruskal-Wallis","Mann-Whitney U","Friedman test","Chi-square"],"Kruskal-Wallis = rank-based one-way ANOVA. Friedman is the repeated-measures version."],
 ["A key chi-square assumption is…",["Expected counts of at least 5 per cell","Normally distributed data","Equal variances","Interval-level data"],"Small expected counts make the chi-square approximation unreliable. Use Fisher's exact test instead."]
],gen:[]},

{t:"Correlation & Regression",tag:"Unit 8",sub:"Relationships and prediction",
guide:[
 "<b>Pearson r</b> ranges −1 to +1. Sign = direction, size = strength. Rough guide: .1 weak, .3 moderate, .5+ strong.",
 "<b>r²</b> = proportion of variance in Y explained by X. r = .6 → r² = .36 (36%).",
 "Correlation ≠ causation. A third variable may drive both.",
 "<b>Regression</b> <span class='formula'>ŷ = b₀ + b₁x</span>. Slope b₁ = change in predicted Y per 1-unit increase in X.",
 "<b>Spearman's rho</b> for ordinal data or non-linear monotonic relationships.",
 "Outliers can inflate or kill a correlation. Always look at the scatterplot."],
qs:[
 ["r = −0.85 between age and gait speed indicates…",["A strong negative relationship","A weak negative relationship","A strong positive relationship","No relationship"],"Size .85 = strong; minus sign = as age rises, gait speed falls."],
 ["Ice cream sales and drowning deaths are correlated. Best explanation?",["A third variable (hot weather) drives both","Ice cream causes drowning","Drowning causes ice cream sales","The correlation is a Type II error"],"Classic confound. Correlation can't establish causation."],
 ["In ŷ = 12 + 3x, what does 3 mean?",["Predicted Y increases 3 units per 1-unit increase in X","Y equals 3 when X is 0","X explains 3% of Y","The correlation is 0.3"],"The slope is change in predicted Y per unit of X. 12 is the intercept."],
 ["Which correlation is strongest?",["r = −0.72","r = 0.65","r = 0.10","r = −0.30"],"Strength is the absolute value. |−0.72| is largest."],
 ["Correlating ranked pain levels (mild/moderate/severe) with something ordinal calls for…",["Spearman's rho","Pearson's r","Chi-square","Independent t-test"],"Ordinal data → rank-based Spearman correlation."],
 ["r = 0 most precisely means…",["No LINEAR relationship","No relationship of any kind","Perfect relationship","The data are invalid"],"A strong curved (U-shaped) pattern can still give r ≈ 0. Plot it."],
 ["Using a regression line to predict far outside the range of the data is called…",["Extrapolation","Interpolation","Regression to the mean","Overfitting"],"The relationship may not hold beyond observed X values."]
],gen:["r2","reg","reg"]},

{t:"Confidence Intervals & Clinical Stats",tag:"Unit 9",sub:"CIs, effect size, diagnostic accuracy",
guide:[
 "<b>95% CI</b>: if you repeated the study many times, 95% of the intervals built this way would capture the true value.",
 "CI for a <i>difference</i> that includes 0 → not significant at α = .05. CI for a <i>ratio</i> (OR, RR) that includes 1 → not significant.",
 "Wider CI: higher confidence level, smaller n, more variability.",
 "<b>Cohen's d</b>: 0.2 small, 0.5 medium, 0.8 large.",
 "<b>Sensitivity</b> <span class='formula'>TP/(TP+FN)</span>: catches true positives. High Sn, Negative test rules OUT (<b>SnNout</b>).",
 "<b>Specificity</b> <span class='formula'>TN/(TN+FP)</span>: clears true negatives. High Sp, Positive test rules IN (<b>SpPin</b>).",
 "<b>ICC</b> measures reliability of continuous measures (e.g., inter-rater goniometry)."],
qs:[
 ["The 95% CI for the difference between groups is −1.2 to 4.8. Conclusion at α = .05?",["Not significant, because the interval includes 0","Significant, because the interval is mostly positive","Significant, because 4.8 is large","Can't tell without the p-value"],"0 (no difference) is a plausible value inside the interval."],
 ["An odds ratio's 95% CI is 1.4 to 3.1. Conclusion?",["Significant, because 1 is not included","Not significant, because 0 isn't included","Not significant, because the CI is wide","Can't tell"],"For ratios, 1 means no effect. This interval excludes 1."],
 ["Which makes a confidence interval NARROWER?",["Larger sample size","Higher confidence level (99%)","More variability","Smaller sample size"],"More data → smaller SE → tighter interval."],
 ["Cohen's d = 0.8 is considered…",["A large effect","A small effect","A medium effect","No effect"],"Benchmarks: .2 small, .5 medium, .8 large."],
 ["A special test has very high sensitivity. A NEGATIVE result helps you…",["Rule the condition out (SnNout)","Rule the condition in (SpPin)","Calculate specificity","Nothing, sensitivity only applies to positives"],"High-Sn tests rarely miss true cases, so a negative is trustworthy for ruling out."],
 ["A test with very high specificity is positive. That helps you…",["Rule the condition in (SpPin)","Rule the condition out (SnNout)","Estimate prevalence","Measure reliability"],"High-Sp tests rarely flag healthy people, so a positive is trustworthy for ruling in."],
 ["Which statistic assesses inter-rater reliability for goniometer measurements?",["Intraclass correlation coefficient (ICC)","Cohen's d","Chi-square","Odds ratio"],"ICC quantifies agreement between raters on continuous measures. Kappa is for categorical ratings."],
 ["Correct interpretation of a single 95% CI of 4 to 10 points?",["We're 95% confident the method captured the true mean difference, plausibly 4–10","95% of patients improved 4–10 points","There's a 95% chance the sample mean is in 4–10","The p-value is .95"],"Confidence describes the long-run success of the method, not individual patients."]
],gen:["sens","sens"]}
];

/* ---------- number generators ---------- */
const GEN={
 mean(){const a=Array.from({length:5},()=>rnd(2,20));const s=a.reduce((x,y)=>x+y,0);const m=r1(s/5);const md=[...a].sort((x,y)=>x-y)[2];
  return mk(`Five patients rate soreness: <span class="mono">${a.join(", ")}</span>. What is the mean?`,m,[md,r1(s/4),r1(m+1.2),r1(m-0.8)],`Sum = ${s}. Mean = ${s} ÷ 5 = ${m}.`)},
 median(){const a=Array.from({length:7},()=>rnd(10,60));const s=[...a].sort((x,y)=>x-y);const md=s[3];const m=r1(a.reduce((x,y)=>x+y,0)/7);
  return mk(`Session lengths (min): <span class="mono">${a.join(", ")}</span>. What is the median?`,md,[a[3],m,s[2],s[4]],`Sorted: ${s.join(", ")}. The 4th of 7 values is ${md}.`)},
 z(){const mu=pick([30,40,50,60,100]);const sd=pick([4,5,8,10,15]);const z=pick([-2,-1.5,-1,-0.5,0.5,1,1.5,2,2.5]);const x=mu+z*sd;
  return mk(`Grip strength norms: μ = ${mu} kg, σ = ${sd} kg. A patient scores ${x} kg. What is their z-score?`,z,[-z,r2((x-mu)/(sd*sd)),z*2,r2(x/mu)],`z = (${x} − ${mu}) / ${sd} = ${z}.`)},
 pct(){const p=pick([["+1","16%","above"],["−1","16%","below"],["+2","2.5%","above"],["−2","2.5%","below"],["±1","68%","between"],["±2","95%","between"]]);
  const q=p[2]==="between"?`What percent of scores fall between z = ${p[0].replace("±","−")} and z = ${p[0].replace("±","+")}?`:`What percent of scores fall ${p[2]} z = ${p[0]}?`;
  return mk(q,p[1],["16%","2.5%","68%","95%","34%","50%"].filter(v=>v!==p[1]).sort(()=>Math.random()-.5),`Empirical rule: 68% within ±1, 95% within ±2. The tails split what's left equally.`)},
 se(){const sd=pick([6,8,10,12,15,20,24]);const n=pick([4,9,16,25,36,64,100]);const se=r2(sd/Math.sqrt(n));
  return mk(`Population SD = ${sd}, sample size n = ${n}. What is the standard error of the mean?`,se,[r2(sd/n),r2(sd/(n-1)),r2(se*2),r2(sd*Math.sqrt(n)/10)],`SE = σ / √n = ${sd} / ${Math.sqrt(n)} = ${se}.`)},
 df(){const a=rnd(10,40),b=rnd(10,40);return mk(`Independent t-test with groups of ${a} and ${b}. Degrees of freedom?`,a+b-2,[a+b,a+b-1,a-1,b-1],`df = n₁ + n₂ − 2 = ${a} + ${b} − 2 = ${a+b-2}.`)},
 r2(){const r=pick([.3,.4,.5,.6,.7,.8,.9,-.5,-.6,-.7]);const v=Math.round(r*r*100);
  return mk(`r = ${r} between hip strength and single-leg hop distance. What percent of variance in hop distance is explained?`,v+"%",[Math.round(Math.abs(r)*100)+"%",(100-v)+"%",Math.round(Math.abs(r)*50)+"%"],`r² = (${r})² = ${r2(r*r)} → ${v}%.`)},
 reg(){const b=pick([.3,.4,.5]);const age=pick([20,25,30,35,40,45,50,55,60]);const y=r1(60-b*age);
  return mk(`Predicted VO₂max = 60 − ${b} × age. Predicted VO₂max for a ${age}-year-old?`,y,[r1(60+b*age),r1(b*age),60-age,r1(y+5)],`ŷ = 60 − ${b} × ${age} = 60 − ${r1(b*age)} = ${y}.`)},
 sens(){const tp=rnd(30,90),fn=rnd(5,30),fp=rnd(5,30),tn=rnd(40,120);const which=Math.random()<.5;
  const sn=Math.round(tp/(tp+fn)*100),sp=Math.round(tn/(tn+fp)*100),ppv=Math.round(tp/(tp+fp)*100),acc=Math.round((tp+tn)/(tp+tn+fp+fn)*100);
  const q=`Special test vs. MRI: TP = ${tp}, FN = ${fn}, FP = ${fp}, TN = ${tn}. What is the ${which?"sensitivity":"specificity"}?`;
  return which?mk(q,sn+"%",[sp+"%",ppv+"%",acc+"%"],`Sensitivity = TP / (TP + FN) = ${tp} / ${tp+fn} = ${sn}%.`)
              :mk(q,sp+"%",[sn+"%",ppv+"%",acc+"%"],`Specificity = TN / (TN + FP) = ${tn} / ${tn+fp} = ${sp}%.`)}
};

/* ---------- state ---------- */
const RANKS=[[0,"Undergrad"],[150,"Research Assistant"],[400,"Data Analyst"],[800,"Biostatistician"],[1300,"Principal Investigator"],[2000,"Tenured Professor"]];
let S={xp:0,stars:{},missed:[],boss:0};
try{const s=JSON.parse(localStorage.getItem("rtn-state")||"null");if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem("rtn-state",JSON.stringify(S))}catch(e){}};
const rankOf=xp=>{let r=RANKS[0],n=null;for(let i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0]){r=RANKS[i];n=RANKS[i+1]||null}}return {name:r[1],floor:r[0],next:n}};
const cleared=()=>UNITS.filter((u,i)=>S.stars[i]>0).length;
const unlocked=i=>i===0||S.stars[i-1]>0;

/* ---------- bell curve progress ---------- */
function curveSVG(frac){
  const W=600,H=170,pad=24,base=140;const pts=[];
  for(let i=0;i<=120;i++){const z=-3.2+6.4*i/120;const x=pad+(W-2*pad)*i/120;const y=base-110*Math.exp(-z*z/2);pts.push([x,y])}
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const cut=pad+(W-2*pad)*frac;
  const area=line+` L ${W-pad} ${base} L ${pad} ${base} Z`;
  let ticks="";[-3,-2,-1,0,1,2,3].forEach(z=>{const x=pad+(W-2*pad)*(z+3.2)/6.4;ticks+=`<line x1="${x}" y1="${base}" x2="${x}" y2="${base+5}" stroke="var(--muted)"/><text x="${x}" y="${base+20}" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${z>0?"+"+z:z}σ</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Course progress shown as area under a normal curve">
   <defs><clipPath id="cp"><rect x="0" y="0" width="${cut}" height="${H}"/></clipPath></defs>
   <path d="${area}" fill="var(--fill)" clip-path="url(#cp)"/>
   <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2"/>
   <line x1="${pad}" y1="${base}" x2="${W-pad}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>
   ${frac>0&&frac<1?`<line x1="${cut}" y1="20" x2="${cut}" y2="${base}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"/>`:""}
   ${ticks}</svg>`;
}

/* ---------- screens ---------- */
function starsHTML(n,max=3){let s="";for(let i=0;i<max;i++)s+=i<n?"★":`<span class="off">★</span>`;return `<span class="stars" aria-label="${n} of ${max} stars">${s}</span>`}

function renderMap(){
  const rk=rankOf(S.xp);const c=cleared();const frac=c/UNITS.length;
  const pct=rk.next?Math.min(100,(S.xp-rk.floor)/(rk.next[0]-rk.floor)*100):100;
  let nodes=UNITS.map((u,i)=>{
    const st=S.stars[i]||0,open=unlocked(i);
    return `<div class="node ${st?"done":open?"open":"locked"}">
      <div class="rail"><div class="dot">${st?"✓":i+1}</div><div class="stem"></div></div>
      <div class="ucard">
        <div class="row" style="justify-content:space-between"><span class="eyebrow">${u.tag}</span>${starsHTML(st)}</div>
        <h3>${u.t}</h3><p>${u.sub}</p>
        <div class="row">
          <button class="btn primary" ${open?"":"disabled"} onclick="startRound(${i})">${st?"Replay":"Start"}</button>
          <button class="btn" ${open?"":"disabled"} onclick="renderGuide(${i})">Field guide</button>
        </div>
      </div></div>`}).join("");
  const bossOpen=c===UNITS.length;
  nodes+=`<div class="node boss ${S.boss?"done":bossOpen?"open":"locked"}">
    <div class="rail"><div class="dot">${S.boss?"✓":"Ω"}</div><div class="stem"></div></div>
    <div class="ucard"><div class="row" style="justify-content:space-between"><span class="eyebrow">Final boss</span>${starsHTML(S.boss)}</div>
      <h3>Defend Your Thesis</h3><p>15 mixed questions across every unit. Score 12+ to pass. Unlocks when all 9 units are cleared.</p>
      <div class="row"><button class="btn primary" ${bossOpen?"":"disabled"} onclick="startRound('boss')">Face the committee</button></div></div></div>`;
  $("#app").innerHTML=`
   <div class="top"><div><div class="eyebrow">Research methods & statistics</div><h1>Reject the Null</h1></div>
     <div class="rank"><span class="eyebrow">Rank</span><b>${rk.name}</b><span class="mono muted" style="font-size:.8rem">${S.xp} XP${rk.next?" · "+(rk.next[0]-S.xp)+" to "+rk.next[1]:""}</span><div class="xpbar"><i style="width:${pct}%"></i></div></div></div>
   <div class="curve"><div class="cap"><span class="eyebrow">Area under the curve = course cleared</span><span class="big mono">${Math.round(frac*100)}%</span></div>${curveSVG(frac)}</div>
   ${S.missed.length?`<div class="ucard" style="margin:0"><div class="row" style="justify-content:space-between"><div><h3>Review deck</h3><p>${S.missed.length} question${S.missed.length>1?"s":""} you've missed. Clear them to remove them.</p></div><button class="btn primary" onclick="startRound('review')">Review</button></div></div>`:""}
   <div class="path">${nodes}</div>
   <div class="row" style="justify-content:space-between"><span class="toast">Clear a unit with 6 of 8 correct before running out of 3 lives.</span><button class="linkish" onclick="resetAll()" id="rst">Reset progress</button></div>`;
  window.scrollTo(0,0);
}
let resetArm=false;
function resetAll(){if(!resetArm){resetArm=true;$("#rst").textContent="Tap again to erase everything";return}S={xp:0,stars:{},missed:[],boss:0};save();resetArm=false;renderMap()}

function renderGuide(i){
  const u=UNITS[i];
  $("#app").innerHTML=`<div><span class="eyebrow">${u.tag} · Field guide</span><h2>${u.t}</h2></div>
   <div class="guide"><ul>${u.guide.map(g=>`<li>${g}</li>`).join("")}</ul></div>
   <div class="row"><button class="btn primary" onclick="startRound(${i})">Start the round</button><button class="btn" onclick="renderMap()">Back to map</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- rounds ---------- */
let R=null;
function bankQ(ui,qi){const [q,o,e]=UNITS[ui].qs[qi];return {q,o,e,id:ui+"-"+qi,unit:ui}}
function genQ(ui,name){const [q,o,e]=GEN[name]();return {q,o,e,id:null,unit:ui}}
function buildSet(ui,n){
  const u=UNITS[ui];const nGen=Math.min(u.gen.length,3);
  const bank=shuffle(u.qs.map((_,k)=>k)).slice(0,n-nGen).map(k=>bankQ(ui,k));
  const gens=shuffle(u.gen).slice(0,nGen).map(g=>genQ(ui,g));
  return shuffle([...bank,...gens]);
}
function startRound(mode){
  let qs,label,lives=3,need,mult=1;
  if(mode==="boss"){
    qs=[];const order=shuffle(UNITS.map((_,i)=>i));
    for(let k=0;k<15;k++){const ui=order[k%9];const u=UNITS[ui];
      if(u.gen.length&&Math.random()<.4)qs.push(genQ(ui,pick(u.gen)));else qs.push(bankQ(ui,rnd(0,u.qs.length-1)))}
    const seen=new Set();qs=qs.filter(q=>!q.id||!seen.has(q.id)&&seen.add(q.id));
    while(qs.length<15){const ui=rnd(0,8);const q=bankQ(ui,rnd(0,UNITS[ui].qs.length-1));if(!qs.some(x=>x.id===q.id))qs.push(q)}
    label="Final boss · Defend Your Thesis";lives=4;need=12;mult=2;
  }else if(mode==="review"){
    qs=shuffle(S.missed).slice(0,10).map(id=>{const [a,b]=id.split("-").map(Number);return bankQ(a,b)});
    label="Review deck";lives=99;need=0;
  }else{qs=buildSet(mode,8);label=UNITS[mode].tag+" · "+UNITS[mode].t;need=6}
  R={mode,qs,label,i:0,lives,maxLives:lives,need,mult,correct:0,streak:0,best:0,xp:0,marks:[]};
  renderQ();
}
function renderQ(){
  const q=R.qs[R.i];const order=shuffle(q.o.map((t,k)=>({t,ok:k===0})));R.order=order;
  const pips=R.qs.map((_,k)=>`<i class="${k<R.i?(R.marks[k]?"ok":"no"):k===R.i?"cur":""}"></i>`).join("");
  const lives=R.maxLives<20?`<div class="lives" aria-label="${R.lives} lives left">${Array.from({length:R.maxLives},(_,k)=>`<i class="${k<R.lives?"":"lost"}"></i>`).join("")}</div>`:"";
  const topic=R.mode==="boss"||R.mode==="review"?`<span class="eyebrow">${UNITS[q.unit].t}</span>`:"";
  $("#app").innerHTML=`
   <div class="hud"><button class="linkish" onclick="renderMap()">← Map</button><span class="eyebrow">${R.label}</span>${lives}</div>
   <div class="hud"><div class="pips">${pips}</div><span class="streak">${R.streak>1?"Streak ×"+R.streak:""}</span></div>
   <div class="qcard">${topic}<div class="qtext">${q.q}</div>
     <div class="opts">${order.map((o,k)=>`<button class="opt" id="o${k}" onclick="answer(${k})"><span>${"ABCD"[k]}</span><span>${o.t}</span></button>`).join("")}</div>
     <div id="fb"></div></div>`;
}
function answer(k){
  const q=R.qs[R.i];const ok=R.order[k].ok;
  R.order.forEach((o,j)=>{const b=$("#o"+j);b.disabled=true;if(o.ok)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  R.marks[R.i]=ok;
  if(ok){R.correct++;R.streak++;R.best=Math.max(R.best,R.streak);const gain=(10+Math.min(10,2*(R.streak-1)))*R.mult;R.xp+=gain;
    if(q.id&&R.mode==="review")S.missed=S.missed.filter(x=>x!==q.id);
  }else{R.streak=0;R.lives--;if(q.id&&!S.missed.includes(q.id))S.missed.push(q.id)}
  save();
  const last=R.i===R.qs.length-1||R.lives<=0;
  $("#fb").innerHTML=`<div class="fb ${ok?"":"no"}"><b>${ok?"Correct.":"Not quite."}</b> ${q.e}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="nx" onclick="${last?"finish()":"next()"}">${last?"See results":"Next question"}</button></div>`;
  $("#nx").focus({preventScroll:true});$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){R.i++;renderQ()}
function finish(){
  const total=R.qs.length;const out=R.lives<=0;let stars=0,pass=false,title,msg;
  if(R.mode==="review"){pass=true;title="Review complete";msg=S.missed.length?`${S.missed.length} still in your deck.`:"Deck cleared."}
  else{
    pass=!out&&R.correct>=R.need;
    if(pass)stars=R.mode==="boss"?(R.correct>=15?3:R.correct>=13?2:1):(R.correct>=8?3:R.correct>=7?2:1);
    if(pass)R.xp+=50*R.mult;
    if(R.mode==="boss"){if(pass)S.boss=Math.max(S.boss,stars)}else if(pass)S.stars[R.mode]=Math.max(S.stars[R.mode]||0,stars);
    title=pass?(R.mode==="boss"?"Thesis defended":"p < .05 · Null rejected"):"Fail to reject";
    msg=pass?(R.mode==="boss"?"The committee signs off. You've earned the title.":"Unit cleared. Next unit unlocked."):out?"Out of lives. Read the field guide, then rerun it.":`You needed ${R.need} correct. Read the field guide, then rerun it.`;
  }
  S.xp+=R.xp;save();
  const retry=R.mode==="review"?"'review'":R.mode==="boss"?"'boss'":R.mode;
  $("#app").innerHTML=`<div class="qcard result"><span class="eyebrow">${R.label}</span>
    <div class="score mono">${R.correct}/${total}</div>
    <h2>${title}</h2>${R.mode!=="review"?starsHTML(stars):""}
    <p class="muted" style="margin:0;max-width:44ch">${msg}</p>
    <p class="mono" style="margin:0">+${R.xp} XP · best streak ${R.best}</p>
    <div class="row" style="justify-content:center">
      ${typeof R.mode==="number"&&pass&&R.mode<8?`<button class="btn primary" onclick="renderGuide(${R.mode+1})">Next unit</button>`:""}
      <button class="btn ${pass&&typeof R.mode==="number"&&R.mode<8?"":"primary"}" onclick="startRound(${retry})">Run it again</button>
      ${typeof R.mode==="number"&&!pass?`<button class="btn" onclick="renderGuide(${R.mode})">Field guide</button>`:""}
      <button class="btn" onclick="renderMap()">Map</button></div></div>`;
  window.scrollTo(0,0);
}
renderMap();
</script>
</body>
</html>
